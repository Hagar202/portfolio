<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation Test</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0f0f1e;
            overflow: hidden;
            font-family: monospace;
            color: white;
        }
        
        #status {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 10px;
            z-index: 1000;
        }
        
        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        
        #matrix-canvas {
            opacity: 0.5;
        }
        
        #particles-canvas {
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div id="status">
        <h2>🔍 Animation Test</h2>
        <p id="matrix-status">❌ Matrix: Not loaded</p>
        <p id="particles-status">❌ Particles: Not loaded</p>
        <p id="canvas-status">❌ Canvas: Not found</p>
    </div>
    
    <canvas id="matrix-canvas"></canvas>
    <canvas id="particles-canvas"></canvas>
    
    <script>
        // Status updates
        const matrixStatus = document.getElementById('matrix-status');
        const particlesStatus = document.getElementById('particles-status');
        const canvasStatus = document.getElementById('canvas-status');
        
        // Check if canvases exist
        const matrixCanvas = document.getElementById('matrix-canvas');
        const particlesCanvas = document.getElementById('particles-canvas');
        
        if (matrixCanvas && particlesCanvas) {
            canvasStatus.textContent = '✅ Canvas: Found!';
            canvasStatus.style.color = '#10b981';
        }
        
        // Matrix Rain
        if (matrixCanvas) {
            const ctx = matrixCanvas.getContext('2d');
            matrixCanvas.width = window.innerWidth;
            matrixCanvas.height = window.innerHeight;
            
            const chars = 'AI ML PYTHON TENSOR FLOW 01';
            const fontSize = 14;
            const columns = matrixCanvas.width / fontSize;
            const drops = [];
            
            for (let i = 0; i < columns; i++) {
                drops[i] = Math.random() * -100;
            }
            
            function drawMatrix() {
                ctx.fillStyle = 'rgba(15, 15, 30, 0.05)';
                ctx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
                
                ctx.fillStyle = '#6366f1';
                ctx.font = fontSize + 'px monospace';
                
                for (let i = 0; i < drops.length; i++) {
                    const char = chars[Math.floor(Math.random() * chars.length)];
                    ctx.fillText(char, i * fontSize, drops[i] * fontSize);
                    
                    if (drops[i] * fontSize > matrixCanvas.height && Math.random() > 0.95) {
                        drops[i] = 0;
                    }
                    drops[i]++;
                }
            }
            
            setInterval(drawMatrix, 50);
            matrixStatus.textContent = '✅ Matrix: Running!';
            matrixStatus.style.color = '#10b981';
        }
        
        // Particles
        if (particlesCanvas) {
            const pCtx = particlesCanvas.getContext('2d');
            particlesCanvas.width = window.innerWidth;
            particlesCanvas.height = window.innerHeight;
            
            class Particle {
                constructor() {
                    this.x = Math.random() * particlesCanvas.width;
                    this.y = Math.random() * particlesCanvas.height;
                    this.vx = (Math.random() - 0.5) * 0.5;
                    this.vy = (Math.random() - 0.5) * 0.5;
                    this.radius = 2;
                }
                
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    if (this.x < 0 || this.x > particlesCanvas.width) this.vx *= -1;
                    if (this.y < 0 || this.y > particlesCanvas.height) this.vy *= -1;
                }
                
                draw() {
                    pCtx.beginPath();
                    pCtx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    pCtx.fillStyle = '#6366f1';
                    pCtx.fill();
                }
            }
            
            const particles = [];
            for (let i = 0; i < 50; i++) {
                particles.push(new Particle());
            }
            
            function animate() {
                pCtx.clearRect(0, 0, particlesCanvas.width, particlesCanvas.height);
                
                particles.forEach(p => {
                    p.update();
                    p.draw();
                });
                
                // Connect particles
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        
                        if (dist < 150) {
                            pCtx.beginPath();
                            pCtx.strokeStyle = `rgba(99, 102, 241, ${1 - dist/150})`;
                            pCtx.lineWidth = 0.5;
                            pCtx.moveTo(particles[i].x, particles[i].y);
                            pCtx.lineTo(particles[j].x, particles[j].y);
                            pCtx.stroke();
                        }
                    }
                }
                
                requestAnimationFrame(animate);
            }
            
            animate();
            particlesStatus.textContent = '✅ Particles: Running!';
            particlesStatus.style.color = '#10b981';
        }
        
        // Resize handler
        window.addEventListener('resize', () => {
            if (matrixCanvas) {
                matrixCanvas.width = window.innerWidth;
                matrixCanvas.height = window.innerHeight;
            }
            if (particlesCanvas) {
                particlesCanvas.width = window.innerWidth;
                particlesCanvas.height = window.innerHeight;
            }
        });
    </script>
</body>
</html>
